<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Bakery Admin – Gallery Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B0B0B;
      color: #F8F6F0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: #151515;
      padding: 24px;
      border-radius: 28px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 12px 48px rgba(0,0,0,0.7);
      align-self: flex-start;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .admin-icon { font-size: 2.8rem; display: block; }
    .admin-header h1 {
      color: #D4AF37;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .admin-header p {
      color: #a6977d;
      font-size: 0.9rem;
      margin-top: 2px;
      font-weight: 300;
    }

    /* ---- Login ---- */
    .login-box {
      max-width: 400px;
      margin: 0 auto;
    }
    .login-box label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #c4b8a2;
      margin-bottom: 5px;
    }
    .input-group {
      position: relative;
      background: #1e1e1e;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
    }
    .input-group:focus-within {
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .input-group input {
      width: 100%;
      padding: 16px 16px;
      background: transparent;
      border: none;
      color: #F8F6F0;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
    }
    .input-group input::placeholder { color: #6a5f4e; }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #8a7d66;
      padding: 0 16px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
    }
    .toggle-btn:hover { color: #D4AF37; }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: #D4AF37;
      color: #0B0B0B;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-primary:hover { background: #b8962e; }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 1.6em;
    }
    .status-msg.error { color: #ff6b6b; }
    .status-msg.success { color: #6bff6b; }
    .status-msg.info { color: #a6977d; }

    .hidden { display: none !important; }

    /* ---- Upload Section ---- */
    .upload-area {
      margin: 16px 0 24px;
    }
    .file-wrapper {
      position: relative;
      margin-bottom: 10px;
    }
    .file-wrapper input[type="file"] {
      width: 100%;
      padding: 14px;
      background: #1e1e1e;
      border: 2px dashed rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      color: #c4b8a2;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .file-wrapper input[type="file"]::file-selector-button {
      background: #D4AF37;
      color: #0B0B0B;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 14px;
    }
    .desc-input {
      width: 100%;
      padding: 14px;
      background: #1e1e1e;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      color: #F8F6F0;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .desc-input:focus {
      outline: 2px solid #D4AF37;
      outline-offset: 2px;
    }
    .desc-input::placeholder { color: #6a5f4e; }

    .btn-upload {
      width: 100%;
      padding: 16px;
      background: #D4AF37;
      color: #0B0B0B;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-upload:hover { background: #b8962e; }
    .btn-upload:disabled { opacity: 0.5; cursor: not-allowed; }

    .progress-wrap {
      background: #1e1e1e;
      border-radius: 10px;
      height: 8px;
      margin: 12px 0;
      overflow: hidden;
      display: none;
    }
    .progress-wrap .bar {
      width: 0%;
      height: 100%;
      background: #D4AF37;
      transition: width 0.3s;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(212, 175, 55, 0.12);
      margin: 28px 0 20px;
    }

    /* ---- Gallery Grid (preview) ---- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 12px;
    }

    .gallery-item {
      background: #1a1a1a;
      border-radius: 16px;
      border: 2px solid rgba(212, 175, 55, 0.2);
      overflow: hidden;
      transition: border-color 0.3s, transform 0.2s;
      position: relative;
    }
    .gallery-item:hover {
      border-color: rgba(212, 175, 55, 0.5);
      transform: translateY(-2px);
    }
    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .gallery-item .item-info {
      padding: 10px 12px 12px;
      text-align: center;
    }
    .gallery-item .item-desc {
      color: #c4b8a2;
      font-size: 0.85rem;
      word-break: break-word;
      min-height: 2.4em;
      line-height: 1.3;
    }
    .gallery-item .item-desc.empty {
      color: #6a5f4e;
      font-style: italic;
    }

    /* ---- Action Buttons on Card ---- */
    .card-actions {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .card-actions button {
      background: transparent;
      border: none;
      color: #a6977d;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-family: 'Montserrat', sans-serif;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card-actions button:hover {
      background: rgba(212, 175, 55, 0.12);
      color: #D4AF37;
    }
    .card-actions .edit-btn { color: #D4AF37; }
    .card-actions .edit-btn:hover { background: rgba(212, 175, 55, 0.2); }
    .card-actions .delete-btn { color: #ff6b6b; }
    .card-actions .delete-btn:hover { background: rgba(255, 107, 107, 0.15); }

    /* ---- Edit inline ---- */
    .edit-inline {
      padding: 6px 10px;
    }
    .edit-inline input {
      width: 100%;
      padding: 8px 10px;
      background: #111;
      border: 1px solid #D4AF37;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      font-family: 'Montserrat', sans-serif;
    }
    .edit-inline input:focus { outline: 2px solid #D4AF37; }
    .edit-inline .edit-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
    }
    .edit-inline .edit-actions button {
      padding: 4px 14px;
      border-radius: 6px;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .edit-inline .save-btn {
      background: #6bff6b;
      color: #0B0B0B;
    }
    .edit-inline .save-btn:hover { background: #4ae04a; }
    .edit-inline .cancel-btn {
      background: #ff6b6b;
      color: #0B0B0B;
    }
    .edit-inline .cancel-btn:hover { background: #e04a4a; }

    /* ---- Empty state ---- */
    .empty-state {
      color: #6a5f4e;
      text-align: center;
      padding: 40px 0;
      font-size: 1rem;
      grid-column: 1 / -1;
    }

    /* ---- Back link ---- */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #6a5f4e;
      text-decoration: none;
      font-size: 0.85rem;
      transition: 0.3s;
    }
    .back-link:hover { color: #D4AF37; }
    .back-link i { margin-right: 6px; }

    /* ---- Responsive ---- */
    @media (max-width: 600px) {
      .container { padding: 16px; border-radius: 20px; }
      .admin-header h1 { font-size: 1.7rem; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .gallery-item img { height: 160px; }
      .gallery-item .item-info { padding: 8px 10px 10px; }
      .gallery-item .item-desc { font-size: 0.8rem; }
      .card-actions button { font-size: 0.7rem; padding: 4px 10px; }
    }
    @media (max-width: 400px) {
      .gallery-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .gallery-item img { height: 140px; }
      .container { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="admin-header">
    <span class="admin-icon">🧁</span>
    <h1>Gallery Manager</h1>
    <p>Upload, edit &amp; delete your bakery images</p>
  </div>

  <!-- Login Section -->
  <div id="loginSection" class="login-box">
    <label for="adminPassword">Admin Password</label>
    <div class="input-group">
      <input type="password" id="adminPassword" placeholder="Enter your password" />
      <button class="toggle-btn" id="togglePasswordBtn" type="button" aria-label="Toggle password visibility">
        <i class="fas fa-eye" id="toggleIcon"></i>
      </button>
    </div>
    <button class="btn-primary" id="loginBtn"><i class="fas fa-unlock"></i> Login</button>
    <div id="loginStatus" class="status-msg info">Enter your password to manage the gallery.</div>
  </div>

  <!-- Upload Section -->
  <div id="uploadSection" class="hidden">

    <div class="upload-area">
      <div class="file-wrapper">
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <input type="text" id="descInput" class="desc-input" placeholder="Image description (optional)" />
      <div class="progress-wrap" id="progressContainer">
        <div class="bar" id="progressBar"></div>
      </div>
      <button class="btn-upload" id="uploadBtn"><i class="fas fa-cloud-upload-alt"></i> Upload to Gallery</button>
      <div id="uploadStatus" class="status-msg info"></div>
    </div>

    <hr class="divider" />

    <h3 style="color: #D4AF37; font-family: 'Playfair Display', serif; font-size: 1.3rem; text-align: center; margin-bottom: 4px;">
      <i class="fas fa-images"></i> Your Gallery
    </h3>
    <p style="color: #6a5f4e; font-size: 0.8rem; text-align: center; margin-bottom: 12px;">
      <span style="color: #D4AF37;">✏️</span> Edit description  ·  <span style="color: #ff6b6b;">🗑️</span> Delete image
    </p>

    <div class="gallery-grid" id="previewGrid">
      <div class="empty-state">No images uploaded yet.</div>
    </div>
  </div>

  <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
</div>

<script>
  // ============================================================
  //  FIREBASE CONFIG – YOUR CONFIGURATION
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyC80QmqF9l03rzPOfCo9P8BEpj67B5_hvQ",
    authDomain: "bridgets-bakery-gallery.firebaseapp.com",
    databaseURL: "https://bridgets-bakery-gallery-default-rtdb.firebaseio.com",
    projectId: "bridgets-bakery-gallery",
    storageBucket: "bridgets-bakery-gallery.firebasestorage.app",
    messagingSenderId: "51437476915",
    appId: "1:51437476915:web:069bce9c3bdddff4001746"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  // ============================================================

  (function() {
    'use strict';

    const CLOUD_NAME = 'dwtlbu0d';
    const UPLOAD_PRESET = 'bakery_upload';
    const ADMIN_PASSWORD = 'BridgetBakery2026!'; // Change this!

    // DOM refs
    const loginSection = document.getElementById('loginSection');
    const uploadSection = document.getElementById('uploadSection');
    const passwordInput = document.getElementById('adminPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    const loginBtn = document.getElementById('loginBtn');
    const loginStatus = document.getElementById('loginStatus');
    const fileInput = document.getElementById('fileInput');
    const descInput = document.getElementById('descInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const previewGrid = document.getElementById('previewGrid');

    // --- Password toggle ---
    let passwordVisible = false;
    toggleBtn.addEventListener('click', function() {
      passwordVisible = !passwordVisible;
      passwordInput.type = passwordVisible ? 'text' : 'password';
      toggleIcon.className = passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    // --- Load preview ---
    async function loadPreview() {
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        if (doc.exists) {
          const items = doc.data().urls || [];
          renderItems(items);
        } else {
          await db.collection('gallery').doc('images').set({ urls: [] });
          renderItems([]);
        }
      } catch (err) {
        console.error('Error loading preview:', err);
        previewGrid.innerHTML = '<div class="empty-state">Error loading gallery.</div>';
      }
    }

    function renderItems(items) {
      previewGrid.innerHTML = '';
      if (items.length === 0) {
        previewGrid.innerHTML = '<div class="empty-state">No images uploaded yet.</div>';
        return;
      }
      items.forEach((item, index) => {
        const url = typeof item === 'string' ? item : item.url;
        const description = typeof item === 'string' ? '' : (item.description || '');
        const div = document.createElement('div');
        div.className = 'gallery-item';
        div.dataset.url = url;
        div.dataset.index = index;

        const img = document.createElement('img');
        img.src = url;
        img.alt = description || 'Gallery image';
        img.loading = 'lazy';

        const info = document.createElement('div');
        info.className = 'item-info';

        const descDiv = document.createElement('div');
        descDiv.className = 'item-desc' + (description ? '' : ' empty');
        descDiv.textContent = description || '(no description)';

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.innerHTML = '<i class="fas fa-pen"></i> Edit';
        editBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          startEdit(div, url, description);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
        deleteBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          deleteImage(url);
        });

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        info.appendChild(descDiv);
        info.appendChild(actions);
        div.appendChild(img);
        div.appendChild(info);
        previewGrid.appendChild(div);
      });
    }

    // --- Edit description ---
    function startEdit(container, url, currentDesc) {
      // If already editing, cancel first
      const existingEdit = container.querySelector('.edit-inline');
      if (existingEdit) return;

      const info = container.querySelector('.item-info');
      const descDiv = info.querySelector('.item-desc');
      const actions = info.querySelector('.card-actions');

      // Hide description and actions
      descDiv.style.display = 'none';
      actions.style.display = 'none';

      const editWrap = document.createElement('div');
      editWrap.className = 'edit-inline';

      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentDesc || '';
      input.placeholder = 'Enter description...';
      input.autofocus = true;

      const btnWrap = document.createElement('div');
      btnWrap.className = 'edit-actions';

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', function() {
        const newDesc = input.value.trim();
        updateDescription(url, newDesc, container);
      });

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'cancel-btn';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', function() {
        cancelEdit(container);
      });

      btnWrap.appendChild(saveBtn);
      btnWrap.appendChild(cancelBtn);
      editWrap.appendChild(input);
      editWrap.appendChild(btnWrap);
      info.appendChild(editWrap);
      input.focus();
    }

    function cancelEdit(container) {
      const editWrap = container.querySelector('.edit-inline');
      if (editWrap) editWrap.remove();
      const info = container.querySelector('.item-info');
      const descDiv = info.querySelector('.item-desc');
      const actions = info.querySelector('.card-actions');
      descDiv.style.display = 'block';
      actions.style.display = 'flex';
    }

    async function updateDescription(url, newDesc, container) {
      if (newDesc.trim() === '') newDesc = '';
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        if (doc.exists) {
          let items = doc.data().urls || [];
          items = items.map(item => {
            const itemUrl = typeof item === 'string' ? item : item.url;
            if (itemUrl === url) {
              if (typeof item === 'string') {
                return { url: item, description: newDesc };
              } else {
                return { ...item, description: newDesc };
              }
            }
            return item;
          });
          await docRef.update({ urls: items });
          setStatus(uploadStatus, '✅ Description updated!', 'success');
          loadPreview();
        }
      } catch (err) {
        console.error('Update description error:', err);
        setStatus(uploadStatus, '❌ Update failed: ' + err.message, 'error');
      }
    }

    // --- Delete ---
    async function deleteImage(url) {
      if (!confirm('Delete this image from the gallery?')) return;
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        if (doc.exists) {
          let items = doc.data().urls || [];
          const newItems = items.filter(item => (typeof item === 'string' ? item : item.url) !== url);
          await docRef.update({ urls: newItems });
          setStatus(uploadStatus, '✅ Image deleted!', 'success');
          loadPreview();
        }
      } catch (err) {
        console.error('Delete error:', err);
        setStatus(uploadStatus, '❌ Delete failed: ' + err.message, 'error');
      }
    }

    // --- Login ---
    loginBtn.addEventListener('click', handleLogin);
    passwordInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
      const password = passwordInput.value.trim();
      if (!password) {
        setStatus(loginStatus, 'Please enter your password.', 'error');
        return;
      }
      if (password !== ADMIN_PASSWORD) {
        setStatus(loginStatus, '❌ Incorrect password.', 'error');
        return;
      }
      loginSection.classList.add('hidden');
      uploadSection.classList.remove('hidden');
      setStatus(loginStatus, '✅ Logged in!', 'success');
      loadPreview();
    }

    function setStatus(el, message, type) {
      el.textContent = message;
      el.className = 'status-msg ' + type;
    }

    // --- Upload ---
    uploadBtn.addEventListener('click', function() {
      const file = fileInput.files[0];
      if (!file) {
        setStatus(uploadStatus, 'Please select an image.', 'error');
        return;
      }
      if (!file.type.startsWith('image/')) {
        setStatus(uploadStatus, 'Please select an image file.', 'error');
        return;
      }

      const description = descInput.value.trim();

      uploadBtn.disabled = true;
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus(uploadStatus, '⏳ Uploading...', 'info');

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`);

      xhr.upload.addEventListener('progress', function(e) {
        if (e.lengthComputable) {
          progressBar.style.width = (e.loaded / e.total * 100) + '%';
        }
      });

      xhr.onload = function() {
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          const url = data.secure_url;
          setStatus(uploadStatus, '✅ Saving to gallery...', 'info');
          saveToFirestore(url, description);
        } else {
          let errorMsg = 'Unknown error';
          try {
            const errData = JSON.parse(xhr.responseText);
            errorMsg = errData.error?.message || errorMsg;
          } catch (e) {}
          setStatus(uploadStatus, '❌ Upload failed: ' + errorMsg, 'error');
          uploadBtn.disabled = false;
          progressContainer.style.display = 'none';
        }
      };

      xhr.onerror = function() {
        uploadBtn.disabled = false;
        setStatus(uploadStatus, '❌ Network error.', 'error');
        progressContainer.style.display = 'none';
      };

      xhr.send(formData);
    });

    async function saveToFirestore(url, description) {
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        let items = [];
        if (doc.exists) items = doc.data().urls || [];
        items.push({ url: url, description: description || '' });
        await docRef.set({ urls: items });
        setStatus(uploadStatus, '✅ Image added to gallery!', 'success');
        uploadBtn.disabled = false;
        progressContainer.style.display = 'none';
        fileInput.value = '';
        descInput.value = '';
        loadPreview();
      } catch (err) {
        console.error('Save error:', err);
        setStatus(uploadStatus, '❌ Failed to save: ' + err.message, 'error');
        uploadBtn.disabled = false;
        progressContainer.style.display = 'none';
      }
    }

    // Load preview on page load if already logged in (e.g. after refresh)
    // We'll just wait for login.
  })();
</script>
</body>
</html>
