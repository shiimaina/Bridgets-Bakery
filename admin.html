<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakery Admin – Upload Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B0B0B; color: #F8F6F0; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { max-width: 720px; width: 100%; background: #151515; padding: 2rem; border-radius: 24px; border: 1px solid rgba(212, 175, 55, 0.25); box-shadow: 0 12px 48px rgba(0,0,0,0.7); }
    .admin-icon { font-size: 2.8rem; display: block; text-align: center; margin-bottom: 4px; }
    h1 { color: #D4AF37; font-family: 'Playfair Display', serif; text-align: center; font-size: 1.9rem; }
    .subtitle { text-align: center; color: #a6977d; font-size: 0.9rem; margin-bottom: 28px; font-weight: 300; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: #c4b8a2; margin-bottom: 5px; }
    .input-wrapper { position: relative; display: flex; align-items: center; background: #1e1e1e; border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 10px; }
    .input-wrapper input { width: 100%; padding: 14px 16px; background: transparent; border: none; color: #F8F6F0; font-size: 1rem; font-family: 'Montserrat', sans-serif; outline: none; }
    .toggle-btn { background: transparent; border: none; color: #8a7d66; padding: 0 16px; cursor: pointer; font-size: 1.2rem; }
    .btn-primary { width: 100%; padding: 14px; background: #D4AF37; color: #0B0B0B; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-primary:hover { background: #b8962e; }
    .btn-upload { width: 100%; padding: 14px; background: #D4AF37; color: #0B0B0B; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; }
    .btn-upload:hover { background: #b8962e; }
    .btn-upload:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { text-align: center; font-size: 0.85rem; margin-top: 12px; min-height: 1.6em; }
    .status-msg.error { color: #ff6b6b; }
    .status-msg.success { color: #6bff6b; }
    .status-msg.info { color: #a6977d; }
    .hidden { display: none !important; }
    .divider { border: none; border-top: 1px solid rgba(212, 175, 55, 0.15); margin: 28px 0 24px; }
    .preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 12px;
      justify-content: center;
    }
    .preview-item {
      position: relative;
      background: #1a1a1a;
      border-radius: 12px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      overflow: hidden;
      width: 200px;
      text-align: center;
      padding-bottom: 8px;
    }
    .preview-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .preview-item .desc {
      color: #c4b8a2;
      font-size: 0.8rem;
      padding: 6px 8px;
      word-break: break-word;
      min-height: 2.4em;
    }
    .preview-item .desc-input-edit {
      width: calc(100% - 16px);
      margin: 6px 8px;
      padding: 4px 8px;
      background: #111;
      border: 1px solid #D4AF37;
      border-radius: 6px;
      color: #fff;
      font-size: 0.8rem;
      font-family: 'Montserrat', sans-serif;
    }
    .preview-item .desc-input-edit:focus {
      outline: 2px solid #D4AF37;
    }
    .preview-item .action-buttons {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 4px 0;
    }
    .preview-item .action-btn {
      background: transparent;
      border: none;
      color: #a6977d;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      transition: 0.2s;
    }
    .preview-item .action-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      color: #D4AF37;
    }
    .preview-item .action-btn.save-btn { color: #6bff6b; }
    .preview-item .action-btn.save-btn:hover { background: rgba(107, 255, 107, 0.15); }
    .preview-item .action-btn.cancel-btn { color: #ff6b6b; }
    .preview-item .action-btn.cancel-btn:hover { background: rgba(255, 107, 107, 0.15); }
    .preview-item .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255, 0, 0, 0.8);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      opacity: 0.8;
    }
    .preview-item .delete-btn:hover {
      background: #ff0000;
      transform: scale(1.1);
      opacity: 1;
    }
    .preview-item .edit-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(212, 175, 55, 0.7);
      color: #0B0B0B;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      opacity: 0.8;
    }
    .preview-item .edit-btn:hover {
      background: #D4AF37;
      transform: scale(1.1);
      opacity: 1;
    }
    .preview-empty { color: #6a5f4e; text-align: center; width: 100%; padding: 12px 0; }
    .back-link { display: block; text-align: center; margin-top: 24px; color: #6a5f4e; text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: #D4AF37; }
    .file-input-wrapper { position: relative; margin: 12px 0; }
    .file-input-wrapper input[type="file"] { width: 100%; padding: 12px; background: #1e1e1e; border: 1px dashed rgba(212, 175, 55, 0.3); border-radius: 10px; color: #c4b8a2; font-family: 'Montserrat', sans-serif; cursor: pointer; }
    .file-input-wrapper input[type="file"]::file-selector-button { background: #D4AF37; color: #0B0B0B; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 12px; }
    .upload-progress { background: #1e1e1e; border-radius: 10px; height: 8px; margin: 12px 0; overflow: hidden; display: none; }
    .upload-progress .bar { width: 0%; height: 100%; background: #D4AF37; transition: width 0.3s; }
    .desc-input { width: 100%; padding: 10px; background: #1e1e1e; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 10px; color: #F8F6F0; font-family: 'Montserrat', sans-serif; margin-top: 8px; }
    .desc-input:focus { outline: 2px solid #D4AF37; }
    .desc-input::placeholder { color: #6a5f4e; }
  </style>
</head>
<body>

<div class="container">

  <span class="admin-icon">🧁</span>
  <h1>Gallery Admin</h1>
  <p class="subtitle">Upload new images – they'll appear instantly on your bakery gallery</p>

  <!-- Login Section -->
  <div id="loginSection">
    <div class="form-group">
      <label for="adminPassword">Admin Password</label>
      <div class="input-wrapper">
        <input type="password" id="adminPassword" placeholder="Enter your admin password" />
        <button class="toggle-btn" id="togglePasswordBtn" type="button">
          <i class="fas fa-eye" id="toggleIcon"></i>
        </button>
      </div>
    </div>
    <button class="btn-primary" id="loginBtn"><i class="fas fa-unlock"></i> Login</button>
    <div id="loginStatus" class="status-msg info">Enter your password to access the upload panel.</div>
  </div>

  <!-- Upload Section -->
  <div id="uploadSection" class="hidden">
    <p style="color: #a6977d; font-size: 0.95rem; text-align: center; margin-bottom: 16px;">
      Select an image, add a description (optional), and upload.
    </p>

    <div class="file-input-wrapper">
      <input type="file" id="fileInput" accept="image/*" />
    </div>
    <input type="text" id="descInput" class="desc-input" placeholder="Image description (optional)" />

    <div class="upload-progress" id="progressContainer">
      <div class="bar" id="progressBar"></div>
    </div>

    <button class="btn-upload" id="uploadBtn"><i class="fas fa-cloud-upload-alt"></i> Upload to Gallery</button>

    <div id="uploadStatus" class="status-msg info"></div>

    <hr class="divider" />

    <h3 style="color: #D4AF37; font-family: 'Playfair Display', serif; text-align: center; font-size: 1.2rem;">
      <i class="fas fa-images"></i> Recent Uploads
    </h3>
    <p style="color: #6a5f4e; font-size: 0.8rem; text-align: center; margin-bottom: 12px;">
      <span style="color: #D4AF37;">✏️</span> Edit description  ·  <span style="color: #ff6b6b;">🗑️</span> Delete image
    </p>
    <div id="previewGrid" class="preview-grid">
      <div class="preview-empty">No images uploaded yet.</div>
    </div>
  </div>

  <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
</div>

<script>
  // ============================================================
  //  FIREBASE CONFIG – YOUR CONFIGURATION
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyC80QmqF9l03rzPOfCo9P8BEpj67B5_hvQ",
    authDomain: "bridgets-bakery-gallery.firebaseapp.com",
    databaseURL: "https://bridgets-bakery-gallery-default-rtdb.firebaseio.com",
    projectId: "bridgets-bakery-gallery",
    storageBucket: "bridgets-bakery-gallery.firebasestorage.app",
    messagingSenderId: "51437476915",
    appId: "1:51437476915:web:069bce9c3bdddff4001746"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  // ============================================================

  (function() {
    'use strict';

    const CLOUD_NAME = 'dwtlbu0d';
    const UPLOAD_PRESET = 'bakery_upload';
    const ADMIN_PASSWORD = 'BridgetBakery2026!'; // Change this!

    const loginSection = document.getElementById('loginSection');
    const uploadSection = document.getElementById('uploadSection');
    const passwordInput = document.getElementById('adminPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    const loginBtn = document.getElementById('loginBtn');
    const loginStatus = document.getElementById('loginStatus');
    const fileInput = document.getElementById('fileInput');
    const descInput = document.getElementById('descInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const previewGrid = document.getElementById('previewGrid');

    // --- Password toggle ---
    let passwordVisible = false;
    toggleBtn.addEventListener('click', function() {
      passwordVisible = !passwordVisible;
      passwordInput.type = passwordVisible ? 'text' : 'password';
      toggleIcon.className = passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    // --- Load preview from Firestore ---
    async function loadPreview() {
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        if (doc.exists) {
          const items = doc.data().urls || [];
          previewGrid.innerHTML = '';
          if (items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'preview-empty';
            empty.textContent = 'No images uploaded yet.';
            previewGrid.appendChild(empty);
          } else {
            items.forEach((item, index) => {
              const url = typeof item === 'string' ? item : item.url;
              const description = typeof item === 'string' ? '' : (item.description || '');
              const div = document.createElement('div');
              div.className = 'preview-item';
              div.dataset.url = url;
              div.dataset.index = index;
              const img = document.createElement('img');
              img.src = url;
              img.alt = description || 'Gallery image';
              img.loading = 'lazy';
              const descDiv = document.createElement('div');
              descDiv.className = 'desc';
              descDiv.textContent = description || '(no description)';
              // Edit button (pencil)
              const editBtn = document.createElement('button');
              editBtn.className = 'edit-btn';
              editBtn.innerHTML = '✏️';
              editBtn.title = 'Edit description';
              editBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                startEdit(div, url, description);
              });
              // Delete button (trash)
              const delBtn = document.createElement('button');
              delBtn.className = 'delete-btn';
              delBtn.innerHTML = '🗑️';
              delBtn.title = 'Delete image';
              delBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const urlToDelete = this.parentElement.dataset.url;
                deleteImage(urlToDelete);
              });
              div.appendChild(img);
              div.appendChild(descDiv);
              div.appendChild(editBtn);
              div.appendChild(delBtn);
              previewGrid.appendChild(div);
            });
          }
        } else {
          await db.collection('gallery').doc('images').set({ urls: [] });
          loadPreview();
        }
      } catch (err) {
        console.error('Error loading preview:', err);
        previewGrid.innerHTML = '<div class="preview-empty">Error loading gallery.</div>';
      }
    }

    // --- Edit description logic ---
    function startEdit(container, url, currentDesc) {
      // Remove existing edit UI if any
      const existingEdit = container.querySelector('.desc-edit-wrapper');
      if (existingEdit) return;

      const descDiv = container.querySelector('.desc');
      const originalText = descDiv.textContent;
      // Hide the description text
      descDiv.style.display = 'none';

      const editWrapper = document.createElement('div');
      editWrapper.className = 'desc-edit-wrapper';
      editWrapper.style.padding = '4px 8px';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'desc-input-edit';
      input.value = currentDesc || '';
      input.placeholder = 'Enter description...';

      const btnGroup = document.createElement('div');
      btnGroup.className = 'action-buttons';

      const saveBtn = document.createElement('button');
      saveBtn.className = 'action-btn save-btn';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const newDesc = input.value.trim();
        updateDescription(url, newDesc, container);
      });

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'action-btn cancel-btn';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        cancelEdit(container);
      });

      btnGroup.appendChild(saveBtn);
      btnGroup.appendChild(cancelBtn);
      editWrapper.appendChild(input);
      editWrapper.appendChild(btnGroup);
      container.appendChild(editWrapper);
      input.focus();
    }

    function cancelEdit(container) {
      const editWrapper = container.querySelector('.desc-edit-wrapper');
      if (editWrapper) editWrapper.remove();
      const descDiv = container.querySelector('.desc');
      if (descDiv) descDiv.style.display = 'block';
    }

    async function updateDescription(url, newDesc, container) {
      if (newDesc === '') newDesc = '(no description)';
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        if (doc.exists) {
          let items = doc.data().urls || [];
          // Find the item with matching URL and update its description
          items = items.map(item => {
            const itemUrl = typeof item === 'string' ? item : item.url;
            if (itemUrl === url) {
              if (typeof item === 'string') {
                // Convert old string to object
                return { url: item, description: newDesc };
              } else {
                // Update existing object
                return { ...item, description: newDesc };
              }
            }
            return item;
          });
          await docRef.update({ urls: items });
          setStatus(uploadStatus, '✅ Description updated!', 'success');
          // Reload preview to reflect changes
          loadPreview();
        }
      } catch (err) {
        console.error('Update description error:', err);
        setStatus(uploadStatus, '❌ Update failed: ' + err.message, 'error');
      }
    }

    // --- Delete image ---
    async function deleteImage(url) {
      if (!confirm('Are you sure you want to delete this image from the gallery?')) return;
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        if (doc.exists) {
          let items = doc.data().urls || [];
          const newItems = items.filter(item => (typeof item === 'string' ? item : item.url) !== url);
          await docRef.update({ urls: newItems });
          setStatus(uploadStatus, '✅ Image deleted from gallery!', 'success');
          loadPreview();
        }
      } catch (err) {
        console.error('Delete error:', err);
        setStatus(uploadStatus, '❌ Delete failed: ' + err.message, 'error');
      }
    }

    // --- Login ---
    loginBtn.addEventListener('click', handleLogin);
    passwordInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
      const password = passwordInput.value.trim();
      if (!password) {
        setStatus(loginStatus, 'Please enter your password.', 'error');
        return;
      }
      if (password !== ADMIN_PASSWORD) {
        setStatus(loginStatus, '❌ Incorrect password.', 'error');
        return;
      }
      loginSection.classList.add('hidden');
      uploadSection.classList.remove('hidden');
      setStatus(loginStatus, '✅ Logged in successfully!', 'success');
      loadPreview();
    }

    function setStatus(el, message, type) {
      el.textContent = message;
      el.className = 'status-msg ' + type;
    }

    // --- Upload function ---
    uploadBtn.addEventListener('click', function() {
      const file = fileInput.files[0];
      if (!file) {
        setStatus(uploadStatus, 'Please select an image file.', 'error');
        return;
      }

      if (!file.type.startsWith('image/')) {
        setStatus(uploadStatus, 'Please select a valid image file (JPEG, PNG, etc.).', 'error');
        return;
      }

      const description = descInput.value.trim();

      uploadBtn.disabled = true;
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus(uploadStatus, '⏳ Uploading to Cloudinary...', 'info');

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`);

      xhr.upload.addEventListener('progress', function(e) {
        if (e.lengthComputable) {
          const percent = (e.loaded / e.total) * 100;
          progressBar.style.width = percent + '%';
        }
      });

      xhr.onload = function() {
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          const url = data.secure_url;
          setStatus(uploadStatus, '✅ Uploaded to Cloudinary! Saving to gallery...', 'info');
          saveToFirestore(url, description);
        } else {
          let errorMsg = 'Unknown error';
          try {
            const errData = JSON.parse(xhr.responseText);
            errorMsg = errData.error?.message || errorMsg;
          } catch (e) {}
          setStatus(uploadStatus, '❌ Upload to Cloudinary failed: ' + errorMsg, 'error');
          uploadBtn.disabled = false;
          progressContainer.style.display = 'none';
        }
      };

      xhr.onerror = function() {
        uploadBtn.disabled = false;
        setStatus(uploadStatus, '❌ Network error. Check your connection.', 'error');
        progressContainer.style.display = 'none';
      };

      xhr.send(formData);
    });

    // --- Save URL + Description to Firestore ---
    async function saveToFirestore(url, description) {
      try {
        const docRef = db.collection('gallery').doc('images');
        const doc = await docRef.get();
        let items = [];
        if (doc.exists) {
          items = doc.data().urls || [];
        }
        items.push({ url: url, description: description || '' });
        await docRef.set({ urls: items });
        setStatus(uploadStatus, '✅ Image added to gallery!', 'success');
        uploadBtn.disabled = false;
        progressContainer.style.display = 'none';
        fileInput.value = '';
        descInput.value = '';
        loadPreview();
      } catch (err) {
        console.error('Error saving to Firestore:', err);
        setStatus(uploadStatus, '❌ Failed to save to gallery: ' + err.message, 'error');
        uploadBtn.disabled = false;
        progressContainer.style.display = 'none';
      }
    }

    // Load preview on page load
    loadPreview();
  })();
</script>
</body>
</html>
